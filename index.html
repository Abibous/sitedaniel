<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="estilo.css">
  <title>PÁGINA DE LOGIN</title>
</head>

<body>

  <form id="formLogin">
    <fieldset id="fie">
      <legend>LOGIN</legend>

      <p>
        <label>Login (Email): </label>
        <input type="email" id="loginEmail" required>
      </p>

      <p>
        <label>SENHA :</label>
        <input type="password" id="loginSenha" required>
      </p>

      <center>
        <button type="submit">FAZER LOGIN</button>
      </center>
    </fieldset>
  </form>

  <form id="formCadastro">
    <fieldset id="cad">
      <legend>CASO NÃO TENHA LOGIN, CADASTRE-SE</legend>

      <p>
        <label>Nome</label>
        <input type="text" id="cadastroNome" required>
      </p>

      <p>
        <label>Email</label>
        <input type="email" id="cadastroEmail" required>
      </p>

      <p>
        <label>Senha</label>
        <input type="password" id="cadastroSenha" required>
      </p>

      <center>
        <button type="submit">CADASTRE-SE</button>
        <input type="reset" value="Limpar">
      </center>
    </fieldset>
  </form>

  <form id="formExcluir">
    <fieldset id="exc">
      <legend>EXCLUIR CONTA</legend>

      <p>
        <label>Email: </label>
        <input type="email" id="excluirEmail" required>
      </p>

      <p>
        <label>Senha: </label>
        <input type="password" id="excluirSenha" required>
      </p>

      <center>
        <button type="submit" style="background-color: #d9534f; color: white; border: none; padding: 8px 16px; cursor: pointer;">
          EXCLUIR MINHA CONTA
        </button>
      </center>
    </fieldset>
  </form>

  <fieldset id="lista">
    <legend>USUÁRIOS CADASTRADOS</legend>
    <ul id="listaUsuarios">
      <li>Carregando usuários...</li>
    </ul>
  </fieldset>

  <script type="module">
    // IMPORTAÇÕES FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      deleteDoc,
      collection,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // CONFIG FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAop-jiU9hOIJUbkVRRaKxwEfg77ec7-Ds",
      authDomain: "danielsite-edd5e.firebaseapp.com",
      projectId: "danielsite-edd5e",
      storageBucket: "danielsite-edd5e.firebasestorage.app",
      messagingSenderId: "161459872849",
      appId: "1:161459872849:web:c9d15b88916089ac6a0470"
    };

    // INICIALIZAÇÃO
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // CADASTRO
    document.getElementById("formCadastro").addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("cadastroNome").value;
      const email = document.getElementById("cadastroEmail").value;
      const senha = document.getElementById("cadastroSenha").value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        // SALVA DADOS NO FIRESTORE
        await setDoc(doc(db, "usuarios", user.uid), {
          nome: nome,
          email: email
        });

        alert("Usuário cadastrado!");
        document.getElementById("formCadastro").reset();
      } catch (error) {
        alert(error.message);
      }
    });

    // LOGIN
    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const senha = document.getElementById("loginSenha").value;

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        window.location.href = "site.html";
      } catch (error) {
        alert(error.message);
      }
    });

    // EXCLUIR
    document.getElementById("formExcluir").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("excluirEmail").value;
      const senha = document.getElementById("excluirSenha").value;

      const confirmacao = confirm("Tem certeza que deseja excluir esta conta permanentemente?");
      if (!confirmacao) return;

      try {
        // 1. Autentica o usuário com o e-mail e senha digitados
        const userCredential = await signInWithEmailAndPassword(auth, email, senha);
        const user = userCredential.user;

        // 2. Apaga o documento do usuário na coleção 'usuarios' do Firestore
        await deleteDoc(doc(db, "usuarios", user.uid));

        // 3. Exclui a conta do Firebase Authentication
        await deleteUser(user);

        alert("Usuário excluído com sucesso!");
        document.getElementById("formExcluir").reset();

      } catch (error) {
        alert("Erro ao excluir usuário: " + error.message);
      }
    });

    // LISTAGEM DE USUÁRIOS EM TEMPO REAL
    const ulUsuarios = document.getElementById("listaUsuarios");

    onSnapshot(collection(db, "usuarios"), (snapshot) => {
      // Limpa a lista antes de desenhar os itens atualizados
      ulUsuarios.innerHTML = "";

      if (snapshot.empty) {
        ulUsuarios.innerHTML = "<li>Nenhum usuário cadastrado.</li>";
        return;
      }

      // Percorre todos os documentos da coleção "usuarios"
      snapshot.forEach((doc) => {
        const dados = doc.data();
        const li = document.createElement("li");
        li.textContent = `Nome: ${dados.nome} | Email: ${dados.email}`;
        ulUsuarios.appendChild(li);
      });
    });
  </script>

</body>

</html>
